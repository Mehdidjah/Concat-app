[package]
name = "relay-desktop"
version = "0.1.0"
description = "Relay video editor"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# otherwise collides on Windows. See rust-lang/cargo#8519.
name = "relay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine. Path dependencies rather than a shared workspace on purpose: the
# engine builds, tests and versions on its own, and nothing about it should
# depend on there being a desktop app.
relay-core = { path = "../../engine/crates/relay-core" }
relay-media = { path = "../../engine/crates/relay-media" }
relay-render = { path = "../../engine/crates/relay-render", features = ["gpu"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Engine-owned audio playback: cpal talks to the output device, memmap2 keeps
# decoded PCM disk-backed instead of resident.
cpal = "0.16"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Not panic = "abort": Tauri catches panics on the command thread, and losing
# that turns a recoverable command failure into a dead window.

[profile.dev]
# The UI is unusable if the engine underneath it runs unoptimised.
[profile.dev.package."*"]
opt-level = 2
