name: Release

# Pushing a tag that starts with v (v0.3.0, v0.3.0-alpha.1, ...) builds the
# app for all three platforms and publishes a GitHub release under that tag
# with a DMG, Windows installer EXE and Linux AppImage. Asset names stay
# stable so the website can always use GitHub's /releases/latest/download URL.
#
# Each package contains the application and the non-system runtime libraries
# it needs. The workflow uses ad-hoc/unsigned packaging until the project owner
# configures platform signing credentials.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      package: true

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Concat-*-package
          path: release
          merge-multiple: true

      - name: Verify release installers
        run: |
          set -euo pipefail
          test -f release/Concat-macOS.dmg
          test -f release/Concat-Windows-Setup.exe
          test -f release/Concat-Linux-x86_64.AppImage
          ls -lh release

      - uses: softprops/action-gh-release@v3
        with:
          name: Concat ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Concat is AGPL-3.0-or-later, with a plugin exception for Concat API
            plugins ([LICENSE-EXCEPTIONS.md](https://github.com/jub0t/Concat/blob/main/LICENSE-EXCEPTIONS.md)).
            The binaries link FFmpeg (GPL builds with x264; the Windows and
            Linux archives carry its runtime libraries), compile in whisper.cpp
            (MIT), and statically link sherpa-onnx with GPL-3.0 espeak-ng -
            sources and licences in
            [THIRD_PARTY_NOTICES.md](https://github.com/jub0t/Concat/blob/main/THIRD_PARTY_NOTICES.md).
            Slint is used under its GPL-3.0-only option.

            The macOS app is ad-hoc signed but not Apple-notarized, and the
            Windows installer is currently unsigned. Your operating system may
            show a trust warning until project-owner signing credentials are
            configured.
          fail_on_unmatched_files: true
          files: |
            release/Concat-macOS.dmg
            release/Concat-Windows-Setup.exe
            release/Concat-Linux-x86_64.AppImage
