name: Build App

# Compiles the WolfCut desktop app for macOS and Windows.
#
# Every build stages the static FFmpeg pair into desktop/src-tauri/ffmpeg/
# first - the release guard in build.rs refuses to build without it, because a
# packaged app without its FFmpeg ships broken (no PATH fallback from Finder).
#
# - Pushes to main and manual runs: build and upload the bundles as artifacts.
# - Tags starting with v (v0.1.0-alpha.1, v0.2.0, ...): additionally publish
#   the installers to a GitHub release. Tags containing a hyphen are marked as
#   pre-releases.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --workspace
        working-directory: engine

  app:
    name: App (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Static builds, so the pair runs on machines with nothing installed.
      # macos-latest is Apple Silicon, hence the arm64 build.
      - name: Stage bundled FFmpeg (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/ffmpeg ffdl
          curl -fsSL --retry 5 --retry-all-errors -o ffdl/ffmpeg.zip \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL --retry 5 --retry-all-errors -o ffdl/ffprobe.zip \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o ffdl/ffmpeg.zip -d ffdl/ffmpeg-out
          unzip -o ffdl/ffprobe.zip -d ffdl/ffprobe-out
          mv "$(find ffdl/ffmpeg-out -type f -name ffmpeg | head -1)" desktop/src-tauri/ffmpeg/ffmpeg
          mv "$(find ffdl/ffprobe-out -type f -name ffprobe | head -1)" desktop/src-tauri/ffmpeg/ffprobe
          chmod +x desktop/src-tauri/ffmpeg/ffmpeg desktop/src-tauri/ffmpeg/ffprobe
          desktop/src-tauri/ffmpeg/ffmpeg -version | head -1
          desktop/src-tauri/ffmpeg/ffprobe -version | head -1

      - name: Stage bundled FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force desktop/src-tauri/ffmpeg | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors -o ffmpeg-win.zip `
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          Copy-Item (Get-ChildItem ffdl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName desktop/src-tauri/ffmpeg/
          Copy-Item (Get-ChildItem ffdl -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName desktop/src-tauri/ffmpeg/
          & desktop/src-tauri/ffmpeg/ffmpeg.exe -version | Select-Object -First 1
          & desktop/src-tauri/ffmpeg/ffprobe.exe -version | Select-Object -First 1

      - run: npm ci
        working-directory: desktop

      - run: npm run typecheck
        working-directory: desktop

      # Full release build - LTO and codegen-units=1 make this the slow step.
      - run: npm run app:build
        working-directory: desktop

      # The runtime looks for the pair in the app's resource directory; a
      # bundle that lost them (or their execute bit) would ship broken while
      # this workflow reports green.
      - name: Verify FFmpeg made it into the bundle (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          app="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "no .app produced"; exit 1; }
          for binary in ffmpeg ffprobe; do
            staged="$app/Contents/Resources/ffmpeg/$binary"
            test -x "$staged" || { echo "$staged missing or not executable"; exit 1; }
            "$staged" -version | head -1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WolfCut-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: List what is being published
        run: find bundles -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          name: WolfCut ${{ github.ref_name }}
          # A hyphen in the tag (v0.1.0-alpha.1) marks a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            WolfCut is MPL-2.0. The installers bundle GPL-built FFmpeg binaries,
            invoked as separate programs — sources and licenses in
            [THIRD_PARTY_NOTICES.md](https://github.com/jub0t/WolfCut/blob/main/THIRD_PARTY_NOTICES.md).
          fail_on_unmatched_files: true
          files: |
            bundles/**/*.dmg
            bundles/**/*.msi
            bundles/**/*.exe
