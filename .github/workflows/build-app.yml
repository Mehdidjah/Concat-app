name: Build app

# Builds Concat - the Slint window, `engine/crates/concat` - for macOS,
# Windows and Linux. CI uploads the runnable files as artifacts; tagged
# releases additionally build a DMG, an NSIS installer and an AppImage.
#
# Reusable: ci.yml calls it on every push to main, release.yml on every tag.
# It is the one place the build environment is described:
#
# - The engine links FFmpeg and compiles whisper.cpp in, so a build needs the
#   FFmpeg 7+ development libraries (headers and import libraries), cmake, a
#   C++ toolchain and libclang for bindgen. Nothing is staged beside the
#   binary any more.
# - Homebrew's FFmpeg serves on macOS. Windows and Linux use a BtbN `shared`
#   build, which ships headers, import libraries and the runtime libraries
#   together; FFMPEG_DIR tells the bindings where it is, and the runtime
#   libraries travel with the binary in the artifact.
on:
  workflow_call:
    inputs:
      package:
        description: Build end-user installers for a tagged release
        required: false
        default: false
        type: boolean

env:
  # BtbN's autobuilds: GPL (x264 in), shared, FFmpeg 8.1.
  FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
  FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip

jobs:
  app:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            # Pin the Apple-silicon image so Homebrew does not pull dylibs
            # built for a newer macOS than the app itself.
            os: macos-15
          - platform: windows
            os: windows-latest
          # 22.04, not latest: the binary links the build machine's glibc,
          # so the oldest supported runner is what keeps it runnable on
          # older distributions.
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake.
      - name: System libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake

      - name: Packaging tools (Linux)
        if: inputs.package && matrix.platform == 'linux'
        run: sudo apt-get install -y libfuse2 patchelf

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs.
      - name: FFmpeg development libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib" >> "$GITHUB_ENV"

      - name: FFmpeg development libraries (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install ffmpeg cmake
          ffmpeg_dir=$(brew --prefix ffmpeg)
          echo "FFMPEG_DIR=$ffmpeg_dir" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_dir/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          runtime_dir=$(xcrun clang --print-runtime-dir)
          echo "RUSTFLAGS=-C link-arg=$runtime_dir/libclang_rt.osx.a" >> "$GITHUB_ENV"

      - name: Packaging tools (macOS)
        if: inputs.package && matrix.platform == 'macos'
        run: brew install dylibbundler

      # LLVM from chocolatey provides libclang. The BtbN zip unpacks to one
      # top-level folder.
      - name: FFmpeg development libraries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          curl.exe -fsSL --retry 5 --retry-all-errors -o ffmpeg-win.zip "$env:FFMPEG_WINDOWS"
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # rust-cache restores sherpa's build-script output but intentionally
      # omits its downloaded native archive. Re-run that script so its link
      # path always points at libraries present on this runner.
      - name: Refresh speech native libraries
        run: cargo clean -p sherpa-onnx-sys
        working-directory: engine

      # The shipping profile: fat LTO, panic=abort, stripped. See the
      # workspace Cargo.toml for what each knob costs.
      - name: Build app
        if: matrix.platform != 'windows'
        run: cargo build --profile app -p concat
        working-directory: engine

      # sherpa-onnx's DLL staging currently assumes Cargo's built-in profile
      # directory name. Use the optimized release profile on Windows so its
      # runtime DLLs are staged correctly.
      - name: Build app (Windows)
        if: matrix.platform == 'windows'
        run: cargo build --release -p concat
        working-directory: engine

      # The binary, plus the FFmpeg runtime libraries it loads where those
      # are not the system's.
      - name: Stage (unix)
        if: matrix.platform != 'windows'
        run: |
          set -euo pipefail
          mkdir -p stage
          cp engine/target/app/concat stage/
          if [ -d ffmpeg-dev/lib ]; then
            mkdir -p stage/lib
            cp -a ffmpeg-dev/lib/*.so* stage/lib/
          fi
      - name: Stage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item engine/target/release/concat.exe stage/
          Copy-Item engine/target/release/*.dll stage/
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" stage/

      - name: Package macOS DMG
        if: inputs.package && matrix.platform == 'macos'
        run: |
          set -euo pipefail
          app="package/Concat.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" release
          cp stage/concat "$app/Contents/MacOS/concat"
          chmod +x "$app/Contents/MacOS/concat"
          cp scripts/release/macos/Info.plist "$app/Contents/Info.plist"

          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' engine/Cargo.toml | head -1)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"

          iconset="package/Concat.iconset"
          mkdir -p "$iconset"
          sips -z 16 16 assets/concat_logo_512.png --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 assets/concat_logo_512.png --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 assets/concat_logo_512.png --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 assets/concat_logo_512.png --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 assets/concat_logo_512.png --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 assets/concat_logo_512.png --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 assets/concat_logo_512.png --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 assets/concat_logo_512.png --out "$iconset/icon_256x256@2x.png" >/dev/null
          cp assets/concat_logo_512.png "$iconset/icon_512x512.png"
          sips -z 1024 1024 assets/concat_logo_512.png --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Concat.icns"

          mkdir -p "$app/Contents/Frameworks"
          dylibbundler -od -b \
            -x "$app/Contents/MacOS/concat" \
            -d "$app/Contents/Frameworks" \
            -p @executable_path/../Frameworks

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          dmg_root="package/dmg-root"
          mkdir -p "$dmg_root"
          cp -R "$app" "$dmg_root/Concat.app"
          ln -s /Applications "$dmg_root/Applications"
          hdiutil create \
            -volname Concat \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov release/Concat-macOS.dmg

      - name: Install NSIS
        if: inputs.package && matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows installer
        if: inputs.package && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release | Out-Null
          $stage = (Resolve-Path stage).Path
          $output = Join-Path $PWD "release\Concat-Windows-Setup.exe"
          $version = (Select-String -Path engine/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler not found at $makensis" }
          & $makensis "/DSTAGE_DIR=$stage" "/DOUT_FILE=$output" "/DAPP_VERSION=$version" scripts/release/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Linux AppImage
        if: inputs.package && matrix.platform == 'linux'
        run: |
          set -euo pipefail
          appdir="$PWD/package/Concat.AppDir"
          mkdir -p \
            "$appdir/usr/bin" \
            "$appdir/usr/lib" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps" \
            release
          cp stage/concat "$appdir/usr/bin/concat"
          cp -a stage/lib/. "$appdir/usr/lib/"
          cp scripts/release/linux/io.concat.Concat.desktop "$appdir/usr/share/applications/"
          cp assets/concat_logo_512.png "$appdir/usr/share/icons/hicolor/512x512/apps/io.concat.Concat.png"

          curl -fsSL --retry 5 --retry-all-errors \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export LD_LIBRARY_PATH="$PWD/ffmpeg-dev/lib:$appdir/usr/lib:${LD_LIBRARY_PATH:-}"
          export OUTPUT="$PWD/release/Concat-Linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/concat" \
            --desktop-file "$appdir/usr/share/applications/io.concat.Concat.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/512x512/apps/io.concat.Concat.png" \
            --output appimage
          chmod +x "$OUTPUT"
          file "$OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.package }}
        with:
          name: Concat-${{ matrix.platform }}
          path: stage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: Concat-${{ matrix.platform }}-package
          path: release/*
          if-no-files-found: error
