[package]
name = "concat-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Speech in and out: on-device transcription with whisper.cpp, and text to speech with Kokoro."

[dependencies]
concat-host.workspace = true
concat-media.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# Model downloads. Blocking on purpose: downloads run on their own thread,
# and an async HTTP stack would be a second runtime's worth of dependencies
# for one GET.
ureq = "2"

# Text to speech: the official k2-fsa bindings. Kokoro models arrive as
# tar.bz2 archives, hence tar + bzip2 (pure-Rust decoder) for unpacking them.
tar = "0.4"
bzip2 = "0.6"

# Transcription: whisper.cpp in-process. Built from source by cmake at build
# time; on macOS with Metal so the encoder runs on the GPU.
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# sherpa's Windows static archive uses the static MSVC runtime, while Slint's
# Skia build uses the dynamic runtime. Use sherpa's DLL build on Windows so
# both can coexist; its build script copies the runtime DLLs beside the app.
[target.'cfg(target_os = "windows")'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
sherpa-onnx = "1.13"

[lints]
workspace = true
